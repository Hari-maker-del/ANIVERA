<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
<title id="title">ANIVERA — The Global Animal Intelligence</title>
<desc id="desc">A refined metallic ivory A with amber accents and mammal silhouettes: elephant, deer, and rhinoceros.</desc>
<defs>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff4df"/><stop offset=".35" stop-color="#c7c4bd"/><stop offset=".62" stop-color="#f6eee2"/><stop offset="1" stop-color="#8d8b87"/></linearGradient>
 <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset=".5" stop-color="#fb8122"/><stop offset="1" stop-color="#a84c0a"/></linearGradient>
 <linearGradient id="word" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#c9c4bc"/></linearGradient>
</defs>
<rect width="1000" height="760" fill="#050505"/>
<!-- elegant narrow A monogram -->
<path d="M500 74 L274 480 Q268 493 287 493 L356 493 Q368 493 376 478 L500 253 L624 478 Q632 493 644 493 L713 493 Q732 493 726 480 L500 74Z" fill="url(#metal)"/>
<path d="M500 74 L468 132 L638 437 Q646 452 663 452 L693 452 L500 74Z" fill="#0a0a0a" opacity=".16"/>
<!-- inner cut-out dark field -->
<path d="M500 190 L396 380 Q390 393 406 393 L594 393 Q610 393 604 380Z" fill="#050505"/>
<!-- animal silhouettes, clear negative-space style -->
<!-- Elephant profile -->
<path d="M413 307 Q422 285 448 282 Q470 279 484 296 L496 313 Q502 321 497 330 L489 345 Q486 355 492 366 Q497 378 489 386 Q481 391 474 381 L466 366 Q461 354 466 341 L452 334 Q440 333 434 346 L426 356 L415 351 Q411 344 417 335 L420 326 Q414 319 413 307Z" fill="url(#metal)"/>
<!-- Deer head -->
<path d="M523 296 Q530 282 541 285 L550 299 L557 313 L565 321 L559 330 L551 326 L546 315 L539 310 L533 322 L526 329 L520 322 L527 312 L523 296Z" fill="url(#metal)"/>
<path d="M535 288 L531 273 L522 265 M531 273 L540 263 L544 252 M531 273 L518 270 L512 260 M541 286 L549 273 L548 260 M549 273 L559 269 L565 258" fill="none" stroke="url(#metal)" stroke-width="5" stroke-linecap="round"/>
<!-- Rhino profile -->
<path d="M507 355 Q523 341 543 347 L555 355 L568 353 L580 340 L577 359 L566 368 Q563 385 548 391 L527 391 L515 382 L506 379 L499 369Z" fill="url(#metal)"/>
<!-- gold orbit accent -->
<path d="M296 473 Q493 543 707 356" fill="none" stroke="url(#amber)" stroke-width="11" stroke-linecap="round"/>
<path d="M708 356 Q746 324 736 292" fill="none" stroke="url(#amber)" stroke-width="5" stroke-linecap="round"/>
<!-- wordmark -->
<text x="500" y="590" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="92" letter-spacing="17" fill="url(#word)">ANIVERA</text>
<text x="875" y="548" font-family="Arial, sans-serif" font-size="20" fill="#d8d4cd">™</text>
<path d="M155 645 H255 M745 645 H845" stroke="url(#amber)" stroke-width="3"/>
<text x="500" y="653" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="22" letter-spacing="6" fill="#e6e0d7">THE GLOBAL ANIMAL INTELLIGENCE</text>
</svg>