name: Upscale animal images to 4K

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: animal-4k-upscale
  cancel-in-progress: false

jobs:
  upscale:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image processor
        run: python -m pip install --upgrade pip Pillow

      - name: Upscale all animal images
        run: python tools/upscale_animals_4k.py

      - name: Commit upgraded images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/assets/animals animal-4k-upscale-report.json
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "chore: upscale all animal images to 4K-class resolution"
            git push origin HEAD:main
          fi
